<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI in Science Learning Atlas — top resources</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Same house style as the site: cream and paper, hairlines, 2px corners.
   Dark is the default here because most embeds sit on a dark page;
   ?theme=light switches it. */
:root { color-scheme: dark; --page:#16161a; --surface:#1e1e22; --ink:#f2f0e4; --ink-2:#c7c5ba; --muted:#9a9aa1; --hairline:#2c2c31; --accent:#3aa3b4; }
:root[data-theme="light"] { color-scheme: light; --page:#fffce3; --surface:#fffef2; --ink:#1c1b1d; --ink-2:#4c4c4f; --muted:#78797e; --hairline:#e2dedb; --accent:#0b6b7a; }
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif; background:var(--page); color:var(--ink); padding:16px; font-size:14px; -webkit-font-smoothing:antialiased; }
h1 { font:500 1rem/1.2 "Space Grotesk",system-ui,sans-serif; letter-spacing:-.024em; margin-bottom:3px; }
.sub { color:var(--muted); font-size:.68rem; font-weight:600; text-transform:uppercase; letter-spacing:.1em; padding-bottom:10px; border-bottom:1px solid var(--hairline); }
.row { display:flex; gap:12px; align-items:baseline; border-bottom:1px solid var(--hairline); padding:10px 4px; margin:0 -4px; text-decoration:none; color:inherit; transition:background .12s; }
.row:hover { background:var(--surface); }
.row:hover .t { color:var(--accent); }
.rank { color:var(--muted); font:500 .8rem/1 "Space Grotesk",system-ui,sans-serif; min-width:1.6em; font-variant-numeric:tabular-nums; }
.t { flex:1; font-weight:600; font-size:.84rem; line-height:1.34; }
.v { color:var(--muted); font-size:.74rem; font-weight:600; white-space:nowrap; font-variant-numeric:tabular-nums; }
.foot { margin-top:14px; padding-top:10px; border-top:1px solid var(--hairline); font-size:.68rem; color:var(--muted); }
.foot a { color:var(--accent); text-decoration:none; }
.foot a:hover { text-decoration:underline; text-underline-offset:2px; }
.err { color:var(--muted); font-size:.82rem; padding:20px 0; text-align:center; }
:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
</style>
</head>
<body>
<h1 id="wTitle">Top resources</h1>
<div class="sub" id="wSub"></div>
<div id="wList"><div class="err">Loading…</div></div>
<div class="foot">From <a id="wLink" href="https://ben18785.github.io/ai-sci-resources/" target="_blank" rel="noopener">AI in Science Learning Atlas</a></div>
<script>
/* Embeddable widget. Params:
     ?topic=Machine%20learning   filter to one topic (omit for all)
     &n=10                       how many rows (default 10, max 25)
     &theme=light                light mode (default dark)
   Embed:
     <iframe src=".../widget.html?topic=Machine%20learning" width="100%" height="480" style="border:0"></iframe>
*/
const SUPABASE_URL = "https://sxvovqhvlsnvvufcapii.supabase.co";
const KEY = "sb_publishable_ss6-RIM6aqrzY_nq1ijklQ_kpINsZs1";
const SITE = "https://ben18785.github.io/ai-sci-resources/";
const P = new URLSearchParams(location.search);
if (P.get("theme") === "light") document.documentElement.dataset.theme = "light";
const topic = P.get("topic") || "";
const N = Math.min(25, Math.max(1, parseInt(P.get("n") || "10", 10) || 10));
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

(async () => {
  try {
    const q = topic ? `&category=eq.${encodeURIComponent(topic)}` : "";
    const [res, vc] = await Promise.all([
      fetch(`${SUPABASE_URL}/rest/v1/resources?select=id,title,url,rtype,category&approved=eq.true${q}&apikey=${KEY}`).then(r => r.json()),
      fetch(`${SUPABASE_URL}/rest/v1/vote_counts?select=resource_id,n&apikey=${KEY}`).then(r => r.json())
    ]);
    const votes = {};
    vc.forEach(v => votes[v.resource_id] = (votes[v.resource_id] || 0) + v.n);
    const top = res.map(r => ({ ...r, v: votes[r.id] || 0 })).sort((a, b) => b.v - a.v).slice(0, N);
    document.getElementById("wTitle").textContent = topic ? `Top ${topic} resources` : "Top resources for learning AI in science";
    document.getElementById("wSub").textContent = "Ranked by community votes";
    document.getElementById("wList").innerHTML = top.length ? top.map((r, i) => `
      <a class="row" href="${SITE}#r=${encodeURIComponent(r.id)}" target="_blank" rel="noopener">
        <span class="rank">${i + 1}</span>
        <span class="t">${esc(r.title)}</span>
        <span class="v">▲ ${r.v}</span>
      </a>`).join("") : `<div class="err">No resources yet.</div>`;
  } catch (e) {
    document.getElementById("wList").innerHTML = `<div class="err">Couldn't load — try again shortly.</div>`;
  }
})();
</script>
</body>
</html>
